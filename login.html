<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frutikóng – Iniciar Sesión</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body { background: linear-gradient(135deg, #1a5c0a 0%, #2d7a1f 50%, #4a9e28 100%); min-height: 100vh; }

    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .auth-card {
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }

    .auth-header {
      background: linear-gradient(135deg, #2d7a1f, #4caf50);
      padding: 32px 28px 24px;
      text-align: center;
      color: #fff;
    }
    .auth-header img { height: 80px; margin-bottom: 10px; }
    .auth-header h2 { font-size: 1.6rem; margin-bottom: 4px; }
    .auth-header p  { font-size: 0.88rem; opacity: 0.85; }

    .auth-body { padding: 32px 28px; }

    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-weight: 700;
      font-size: 0.88rem; color: #444; margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap i {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: #bbb; font-size: 0.95rem;
    }
    .input-wrap input {
      width: 100%; padding: 12px 14px 12px 38px;
      border: 2px solid #e8e8e8; border-radius: 12px;
      font-family: 'Nunito', sans-serif; font-size: 0.95rem;
      color: #333; background: #f9f9f9; outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .input-wrap input:focus {
      border-color: var(--verde-claro); background: #fff;
    }
    .toggle-pass {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #bbb; font-size: 0.95rem; padding: 0;
    }
    .toggle-pass:hover { color: var(--verde-selva); }

    .btn-auth {
      width: 100%; padding: 14px;
      border-radius: 30px; border: none; cursor: pointer;
      background: linear-gradient(135deg, #2d7a1f, #4caf50);
      color: #fff; font-family: 'Fredoka One', cursive;
      font-size: 1.05rem;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 14px rgba(45,122,31,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 8px;
    }
    .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(45,122,31,0.4); }
    .btn-auth:disabled { background: #ccc; box-shadow: none; transform: none; cursor: not-allowed; }

    .auth-msg {
      border-radius: 10px; padding: 10px 14px;
      font-size: 0.88rem; font-weight: 700;
      margin-bottom: 16px; display: none;
      text-align: center;
    }
    .auth-msg.error   { background: #fce4ec; color: #c62828; border: 1px solid #ef9a9a; }
    .auth-msg.success { background: #e8f5e0; color: #2d7a1f; border: 1px solid #a5d6a7; }

    .auth-footer {
      text-align: center;
      padding: 0 28px 28px;
      font-size: 0.88rem;
      color: #888;
    }
    .auth-footer a { color: var(--verde-selva); font-weight: 700; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }

    .spinner {
      width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .back-link {
      display: block; text-align: center;
      color: rgba(255,255,255,0.7); font-size: 0.88rem;
      margin-top: 18px; text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="auth-wrap">
    <div>
      <div class="auth-card">
        <!-- Header -->
        <div class="auth-header">
          <img src="assets/img/logo.png" alt="Frutikóng" />
          <h2>¡Bienvenido de vuelta!</h2>
          <p>Inicia sesión para continuar</p>
        </div>

        <!-- Body -->
        <div class="auth-body">
          <div class="auth-msg" id="authMsg"></div>

          <form id="loginForm" novalidate>
            <div class="form-group">
              <label for="email">Correo electrónico</label>
              <div class="input-wrap">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required autocomplete="email" />
              </div>
            </div>

            <div class="form-group">
              <label for="password">Contraseña</label>
              <div class="input-wrap">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Tu contraseña" required autocomplete="current-password" />
                <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">
                  <i class="fa-regular fa-eye" id="eyeIcon"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn-auth" id="btnLogin">
              <span id="btnLoginTxt"><i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión</span>
              <div class="spinner" id="spinner"></div>
            </button>
          </form>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
          ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </div>
      </div>

      <a href="index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Volver al inicio
      </a>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // Si ya hay sesión, redirigir
    if (getUsuario()) window.location.href = 'index.html';

    // Toggle contraseña
    document.getElementById('togglePass').addEventListener('click', () => {
      const input   = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        eyeIcon.className = 'fa-regular fa-eye';
      }
    });

    function mostrarMsg(tipo, texto) {
      const el = document.getElementById('authMsg');
      el.className = `auth-msg ${tipo}`;
      el.textContent = texto;
      el.style.display = 'block';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        mostrarMsg('error', 'Por favor completa todos los campos.');
        return;
      }

      // UI cargando
      const btn     = document.getElementById('btnLogin');
      const txt     = document.getElementById('btnLoginTxt');
      const spinner = document.getElementById('spinner');
      btn.disabled      = true;
      txt.style.display = 'none';
      spinner.style.display = 'block';

      try {
        const res = await llamarAPI({ accion: 'login', email, password });
        if (res.ok) {
          saveUsuario({ nombre: res.nombre, email });
          mostrarMsg('success', `¡Bienvenido, ${res.nombre}! Redirigiendo...`);
          setTimeout(() => window.location.href = 'index.html', 1200);
        } else {
          mostrarMsg('error', res.msg);
          btn.disabled      = false;
          txt.style.display = 'flex';
          spinner.style.display = 'none';
        }
      } catch {
        mostrarMsg('error', 'Error de conexión. Intenta de nuevo.');
        btn.disabled      = false;
        txt.style.display = 'flex';
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
