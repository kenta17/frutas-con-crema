<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frutikóng – Registrarse</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body { background: linear-gradient(135deg, #1a5c0a 0%, #2d7a1f 50%, #4a9e28 100%); min-height: 100vh; }

    .auth-wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 30px 16px;
    }
    .auth-card {
      background: #fff; border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      width: 100%; max-width: 440px; overflow: hidden;
    }
    .auth-header {
      background: linear-gradient(135deg, #e8192c, #ff4d6a);
      padding: 32px 28px 24px; text-align: center; color: #fff;
    }
    .auth-header img { height: 80px; margin-bottom: 10px; }
    .auth-header h2 { font-size: 1.6rem; margin-bottom: 4px; }
    .auth-header p  { font-size: 0.88rem; opacity: 0.85; }

    .auth-body { padding: 32px 28px; }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-weight: 700;
      font-size: 0.88rem; color: #444; margin-bottom: 6px;
    }
    .input-wrap { position: relative; }
    .input-wrap i.ico {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%); color: #bbb; font-size: 0.95rem;
    }
    .input-wrap input {
      width: 100%; padding: 12px 14px 12px 38px;
      border: 2px solid #e8e8e8; border-radius: 12px;
      font-family: 'Nunito', sans-serif; font-size: 0.95rem;
      color: #333; background: #f9f9f9; outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .input-wrap input:focus { border-color: var(--rojo-fresa); background: #fff; }
    .input-wrap input.valid   { border-color: var(--verde-claro); }
    .input-wrap input.invalid { border-color: var(--rojo-fresa); }

    .toggle-pass {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #bbb; font-size: 0.95rem; padding: 0;
    }
    .toggle-pass:hover { color: var(--rojo-fresa); }

    /* Indicador de fuerza de contraseña */
    .pass-strength { margin-top: 6px; }
    .pass-bars { display: flex; gap: 4px; margin-bottom: 3px; }
    .pass-bar  {
      height: 4px; flex: 1; border-radius: 4px;
      background: #e0e0e0; transition: background 0.3s;
    }
    .pass-label { font-size: 0.75rem; color: #aaa; }

    .form-hint { font-size: 0.78rem; color: #bbb; margin-top: 4px; }

    .btn-auth {
      width: 100%; padding: 14px; border-radius: 30px;
      border: none; cursor: pointer;
      background: linear-gradient(135deg, #e8192c, #ff4d6a);
      color: #fff; font-family: 'Fredoka One', cursive; font-size: 1.05rem;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 14px rgba(232,25,44,0.3);
      transition: transform 0.2s, box-shadow 0.2s; margin-top: 8px;
    }
    .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232,25,44,0.4); }
    .btn-auth:disabled { background: #ccc; box-shadow: none; transform: none; cursor: not-allowed; }

    .auth-msg {
      border-radius: 10px; padding: 10px 14px;
      font-size: 0.88rem; font-weight: 700;
      margin-bottom: 16px; display: none; text-align: center;
    }
    .auth-msg.error   { background: #fce4ec; color: #c62828; border: 1px solid #ef9a9a; }
    .auth-msg.success { background: #e8f5e0; color: #2d7a1f; border: 1px solid #a5d6a7; }

    .auth-footer {
      text-align: center; padding: 0 28px 28px;
      font-size: 0.88rem; color: #888;
    }
    .auth-footer a { color: var(--rojo-fresa); font-weight: 700; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }

    .spinner {
      width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,0.4);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .back-link {
      display: block; text-align: center;
      color: rgba(255,255,255,0.7); font-size: 0.88rem;
      margin-top: 18px; text-decoration: none; transition: color 0.2s;
    }
    .back-link:hover { color: #fff; }

    /* Términos */
    .terms-wrap {
      display: flex; align-items: flex-start; gap: 10px;
      margin-bottom: 16px; font-size: 0.85rem; color: #666;
    }
    .terms-wrap input[type=checkbox] { margin-top: 2px; accent-color: var(--rojo-fresa); width: 16px; height: 16px; flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="auth-wrap">
    <div>
      <div class="auth-card">
        <!-- Header -->
        <div class="auth-header">
          <img src="assets/img/logo.png" alt="Frutikóng" />
          <h2>¡Únete a Frutikóng!</h2>
          <p>Crea tu cuenta y disfruta de todos los beneficios</p>
        </div>

        <!-- Body -->
        <div class="auth-body">
          <div class="auth-msg" id="authMsg"></div>

          <form id="registroForm" novalidate>

            <div class="form-group">
              <label for="nombre">Nombre completo</label>
              <div class="input-wrap">
                <i class="fa-solid fa-user ico"></i>
                <input type="text" id="nombre" placeholder="Tu nombre completo" required autocomplete="name" />
              </div>
            </div>

            <div class="form-group">
              <label for="email">Correo electrónico</label>
              <div class="input-wrap">
                <i class="fa-regular fa-envelope ico"></i>
                <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required autocomplete="email" />
              </div>
            </div>

            <div class="form-group">
              <label for="password">Contraseña</label>
              <div class="input-wrap">
                <i class="fa-solid fa-lock ico"></i>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" />
                <button type="button" class="toggle-pass" id="togglePass1" aria-label="Mostrar">
                  <i class="fa-regular fa-eye" id="eye1"></i>
                </button>
              </div>
              <div class="pass-strength">
                <div class="pass-bars">
                  <div class="pass-bar" id="bar1"></div>
                  <div class="pass-bar" id="bar2"></div>
                  <div class="pass-bar" id="bar3"></div>
                  <div class="pass-bar" id="bar4"></div>
                </div>
                <span class="pass-label" id="passLabel">Ingresa una contraseña</span>
              </div>
            </div>

            <div class="form-group">
              <label for="password2">Confirmar contraseña</label>
              <div class="input-wrap">
                <i class="fa-solid fa-lock ico"></i>
                <input type="password" id="password2" placeholder="Repite tu contraseña" required autocomplete="new-password" />
                <button type="button" class="toggle-pass" id="togglePass2" aria-label="Mostrar">
                  <i class="fa-regular fa-eye" id="eye2"></i>
                </button>
              </div>
              <p class="form-hint" id="matchHint"></p>
            </div>

            <div class="terms-wrap">
              <input type="checkbox" id="terminos" />
              <label for="terminos">
                Acepto los términos y condiciones y la política de privacidad de Frutikóng
              </label>
            </div>

            <button type="submit" class="btn-auth" id="btnRegistro">
              <span id="btnRegistroTxt"><i class="fa-solid fa-user-plus"></i> Crear mi cuenta</span>
              <div class="spinner" id="spinner"></div>
            </button>
          </form>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
          ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
        </div>
      </div>

      <a href="index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Volver al inicio
      </a>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // Si ya hay sesión, redirigir
    if (getUsuario()) window.location.href = 'index.html';

    // Toggle contraseñas
    function togglePwd(btnId, inputId, eyeId) {
      document.getElementById(btnId).addEventListener('click', () => {
        const input = document.getElementById(inputId);
        const eye   = document.getElementById(eyeId);
        if (input.type === 'password') {
          input.type = 'text';
          eye.className = 'fa-regular fa-eye-slash';
        } else {
          input.type = 'password';
          eye.className = 'fa-regular fa-eye';
        }
      });
    }
    togglePwd('togglePass1', 'password',  'eye1');
    togglePwd('togglePass2', 'password2', 'eye2');

    // Indicador fuerza contraseña
    document.getElementById('password').addEventListener('input', () => {
      const val    = document.getElementById('password').value;
      const bars   = [1,2,3,4].map(n => document.getElementById(`bar${n}`));
      const label  = document.getElementById('passLabel');
      let fuerza   = 0;
      if (val.length >= 6)  fuerza++;
      if (val.length >= 10) fuerza++;
      if (/[A-Z]/.test(val) || /[0-9]/.test(val)) fuerza++;
      if (/[^a-zA-Z0-9]/.test(val)) fuerza++;

      const colores = ['#e8192c','#ff9800','#f9c800','#4caf50'];
      const textos  = ['Muy débil','Débil','Regular','Segura'];
      bars.forEach((b, i) => {
        b.style.background = i < fuerza ? colores[fuerza - 1] : '#e0e0e0';
      });
      label.textContent  = val.length === 0 ? 'Ingresa una contraseña' : textos[fuerza - 1] || 'Muy débil';
      label.style.color  = fuerza > 0 ? colores[fuerza - 1] : '#aaa';
    });

    // Verificar que coincidan
    document.getElementById('password2').addEventListener('input', () => {
      const p1   = document.getElementById('password').value;
      const p2   = document.getElementById('password2').value;
      const hint = document.getElementById('matchHint');
      if (!p2) { hint.textContent = ''; return; }
      if (p1 === p2) {
        hint.textContent = '✓ Las contraseñas coinciden';
        hint.style.color = '#4caf50';
      } else {
        hint.textContent = '✗ Las contraseñas no coinciden';
        hint.style.color = '#e8192c';
      }
    });

    function mostrarMsg(tipo, texto) {
      const el = document.getElementById('authMsg');
      el.className = `auth-msg ${tipo}`;
      el.textContent = texto;
      el.style.display = 'block';
    }

    document.getElementById('registroForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre    = document.getElementById('nombre').value.trim();
      const email     = document.getElementById('email').value.trim();
      const password  = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const terminos  = document.getElementById('terminos').checked;

      if (!nombre || !email || !password || !password2) {
        mostrarMsg('error', 'Por favor completa todos los campos.'); return;
      }
      if (password.length < 6) {
        mostrarMsg('error', 'La contraseña debe tener al menos 6 caracteres.'); return;
      }
      if (password !== password2) {
        mostrarMsg('error', 'Las contraseñas no coinciden.'); return;
      }
      if (!terminos) {
        mostrarMsg('error', 'Debes aceptar los términos y condiciones.'); return;
      }

      // UI cargando
      const btn     = document.getElementById('btnRegistro');
      const txt     = document.getElementById('btnRegistroTxt');
      const spinner = document.getElementById('spinner');
      btn.disabled       = true;
      txt.style.display  = 'none';
      spinner.style.display = 'block';

      try {
        const res = await llamarAPI({ accion: 'registrar', nombre, email, password });
        if (res.ok) {
          saveUsuario({ nombre: res.nombre, email });
          mostrarMsg('success', `¡Cuenta creada! Bienvenido, ${res.nombre} 🍓`);
          setTimeout(() => window.location.href = 'miembros.html', 1500);
        } else {
          mostrarMsg('error', res.msg);
          btn.disabled       = false;
          txt.style.display  = 'flex';
          spinner.style.display = 'none';
        }
      } catch {
        mostrarMsg('error', 'Error de conexión. Intenta de nuevo.');
        btn.disabled       = false;
        txt.style.display  = 'flex';
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
